name: Stage npm release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    if: github.repository == 'CompN3rd/pi-web-code-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.GITHUB_REF !== `refs/tags/v${pkg.version}`) throw new Error('Run only on a stable v<package-version> tag');
          if (pkg.name !== '@compn3rd/pi-web-code-review' || lock.version !== pkg.version || lock.packages[''].version !== pkg.version) throw new Error('Package/lock mismatch');
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run check:browser
      - name: Pack the verified build and smoke-test its contents
        shell: bash
        run: |
          mkdir -p release unpacked
          npm pack --ignore-scripts --pack-destination release
          tar -xzf release/*.tgz -C unpacked
          node scripts/check-artifacts.mjs "$PWD/unpacked/package"
      - name: Validate isolated tarball publication shape (not authorization)
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          cp -R release "$sandbox/release"
          cd "$sandbox"
          packages=(./release/*.tgz)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          npm publish "${packages[0]}" --dry-run --access public --ignore-scripts --registry=https://registry.npmjs.org/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-ui-screenshots
          path: artifacts/review-ui
          retention-days: 7

  publish:
    name: Stage for npm maintainer 2FA approval
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require a staged-publishing-capable npm CLI
        shell: bash
        run: |
          NPM_VERSION="$(npm --version)" node -e 'const [major,minor] = process.env.NPM_VERSION.split(".").map(Number); if (major < 11 || (major === 11 && minor < 15)) throw new Error("npm >=11.15.0 required for staged publishing")'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release
      - name: Stage verified tarball with OIDC and provenance
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          packages=(./release/*.tgz)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          # No token fallback: a failed OIDC exchange must not masquerade as token auth.
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ] || [ -n "${NPM_ID_TOKEN:-}" ]; then
            echo "::error::Unexpected token configuration in OIDC-only publication"
            exit 1
          fi
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          tar -xOf "${packages[0]}" package/package.json | node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
            if (pkg.name !== "@compn3rd/pi-web-code-review" || !/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.GITHUB_REF !== `refs/tags/v${pkg.version}`) throw new Error("Unexpected artifact name/version");
            if (pkg.repository?.url !== "git+https://github.com/CompN3rd/pi-web-code-review.git") throw new Error("Unexpected artifact repository");
          '
          # npm reports OIDC exchange results at verbose level. Never dump env/JWTs.
          npm stage publish "${packages[0]}" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/ --loglevel=verbose
          echo '### Staged only — not published' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the stage reported above on npmjs.com and approve it with maintainer 2FA. Then verify the public version and provenance before publishing the GitHub release.' >> "$GITHUB_STEP_SUMMARY"
